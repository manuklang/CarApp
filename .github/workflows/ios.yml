name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      carplay:
        description: "CarPlay-Entitlement einbinden (erst aktivieren, wenn Apple es freigegeben hat)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Simulator)
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: scripts/select_xcode.sh
      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project DriveDeck.xcodeproj \
            -scheme DriveDeck \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E 'error:|warning:|BUILD' || true
          grep -q "BUILD SUCCEEDED" build.log

  testflight:
    name: Archivieren & zu TestFlight hochladen
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'de.manuklang.drivedeck' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret für $v fehlt"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ]; then echo "::error::Secret ASC_PRIVATE_KEY fehlt"; missing=1; fi
          exit $missing

      - name: Xcode wählen
        run: scripts/select_xcode.sh

      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App-Store-Connect-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archivieren
        run: |
          set -o pipefail
          if [ "${{ inputs.carplay }}" = "true" ]; then
            ENTITLEMENTS=Config/DriveDeck.entitlements
          else
            ENTITLEMENTS=Config/DriveDeck-NoCarPlay.entitlements
          fi
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Build-Nummer: $BUILD_NUMBER, Entitlements: $ENTITLEMENTS"
          xcodebuild archive \
            -project DriveDeck.xcodeproj \
            -scheme DriveDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DriveDeck.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee archive.log | grep -E 'error:|BUILD|ARCHIVE' || true
          test -d "$RUNNER_TEMP/DriveDeck.xcarchive"

      - name: Exportieren & hochladen
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DriveDeck.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore
