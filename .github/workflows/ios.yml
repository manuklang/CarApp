name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Zu TestFlight hochladen (braucht Apple-Developer-Account + Secrets). Aus = nur Sideload-IPA bauen"
        type: boolean
        default: false
      carplay:
        description: "CarPlay-Entitlement einbinden (erst aktivieren, wenn Apple es freigegeben hat)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Sideload-IPA (unsigniert)
    if: github.event_name == 'push' || !inputs.testflight
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: scripts/select_xcode.sh
      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Für iPhone bauen (ohne Signatur, ohne CarPlay-Entitlement)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DriveDeck.xcodeproj \
            -scheme DriveDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DriveDeck.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=Config/DriveDeck-NoCarPlay.entitlements \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)" | tee build.log | grep -E 'error:|warning:|ARCHIVE' || true
          grep -q "ARCHIVE SUCCEEDED" build.log
      - name: IPA packen
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/DriveDeck.xcarchive/Products/Applications/DriveDeck.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/DriveDeck.ipa" Payload)
          ls -lh DriveDeck.ipa
      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-ipa
          path: DriveDeck.ipa
      - name: IPA als Release „sideload-latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideload-latest --cleanup-tag -y || true
          gh release create sideload-latest DriveDeck.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "DriveDeck – Sideload-Build" \
            --notes "Unsignierte IPA für SideStore/AltStore (ohne CarPlay). Stand: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  testflight:
    name: Archivieren & zu TestFlight hochladen
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'de.manuklang.drivedeck' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        run: |
          missing=0
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret für $v fehlt"; missing=1; fi
          done
          if [ -z "${{ secrets.ASC_PRIVATE_KEY }}" ]; then echo "::error::Secret ASC_PRIVATE_KEY fehlt"; missing=1; fi
          exit $missing

      - name: Xcode wählen
        run: scripts/select_xcode.sh

      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App-Store-Connect-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archivieren
        run: |
          set -o pipefail
          if [ "${{ inputs.carplay }}" = "true" ]; then
            ENTITLEMENTS=Config/DriveDeck.entitlements
          else
            ENTITLEMENTS=Config/DriveDeck-NoCarPlay.entitlements
          fi
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "Build-Nummer: $BUILD_NUMBER, Entitlements: $ENTITLEMENTS"
          xcodebuild archive \
            -project DriveDeck.xcodeproj \
            -scheme DriveDeck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DriveDeck.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee archive.log | grep -E 'error:|BUILD|ARCHIVE' || true
          test -d "$RUNNER_TEMP/DriveDeck.xcarchive"

      - name: Exportieren & hochladen
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DriveDeck.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore
